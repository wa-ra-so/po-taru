<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食べログ営業ツール ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
@property --blend{
  syntax:'<percentage>';
  inherits:true;
  initial-value:50%;
}
:root{
  --orange-1:#FF7A33;
  --orange-2:#FF5A1F;
  --orange-3:#D93F0A;
  --ink:#1a1310;
  --sub:#6b7280;
  --paper:#FAF9F7;
  --ease:cubic-bezier(.16,1,.3,1);
}
html,body{height:100%;}
body{
  font-family:'DM Sans','Noto Sans JP',sans-serif;color:var(--ink);
  background:var(--paper);
  min-height:100vh;display:flex;flex-direction:column;
}

/* ── INTRO ── */
.intro{
  position:fixed;inset:0;z-index:100;background:var(--paper);
  display:flex;align-items:center;justify-content:center;gap:18px;
  transition:opacity .5s var(--ease), visibility .5s var(--ease);
}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none;}
.intro-mark{width:19vw;max-width:96px;min-width:52px;opacity:0;transform:translateY(10px) scale(.85);
  animation:markReveal .5s var(--ease) forwards;animation-delay:.92s;
}
.intro-word{display:flex;font-size:clamp(34px,10vw,72px);font-weight:900;letter-spacing:-.01em;}
.intro-word .ch{display:inline-block;opacity:0;animation:tumbleIn .68s cubic-bezier(.22,.9,.3,1.1) forwards;}
.intro-word .ch:nth-child(1){animation-delay:.02s;}
.intro-word .ch:nth-child(2){animation-delay:.13s;}
.intro-word .ch:nth-child(3){animation-delay:.24s;}
.intro-word .ch:nth-child(4){animation-delay:.35s;}

@keyframes tumbleIn{
  0%{opacity:0;transform:translate(-50px,-70px) rotate(-75deg) scale(.45);}
  55%{opacity:1;transform:translate(4px,4px) rotate(14deg) scale(1.06);}
  78%{opacity:1;transform:translate(-2px,-1px) rotate(-6deg) scale(.98);}
  100%{opacity:1;transform:translate(0,0) rotate(0) scale(1);}
}
@keyframes markReveal{to{opacity:1;transform:translateY(0) scale(1);}}

/* ── SPLIT ── */
.split{
  --blend:50%;
  flex:1;display:flex;flex-direction:column;min-height:100vh;
  background:linear-gradient(180deg,
    var(--orange-3) 0%,
    var(--orange-2) calc(var(--blend) - 32%),
    var(--orange-1) calc(var(--blend) - 12%),
    #ffffff calc(var(--blend) + 8%),
    #ffffff 100%);
  transition:--blend .55s var(--ease);
}
@media(min-width:760px){
  .split{
    flex-direction:row;
    background:linear-gradient(90deg,
      var(--orange-3) 0%,
      var(--orange-2) calc(var(--blend) - 32%),
      var(--orange-1) calc(var(--blend) - 12%),
      #ffffff calc(var(--blend) + 8%),
      #ffffff 100%);
  }
  .split:has(.panel-orange:hover){--blend:66%;}
  .split:has(.panel-white:hover){--blend:34%;}
}

.panel{
  position:relative;flex:1 1 0;min-height:280px;background:transparent;
  display:flex;align-items:flex-end;color:#fff;text-decoration:none;overflow:hidden;
  transition:flex-grow .45s var(--ease);
}
@media(min-width:760px){.panel:hover{flex-grow:1.28;}}

.panel-white{color:var(--ink);}

.panel-bg-icon{position:absolute;bottom:-10%;width:52%;max-width:280px;opacity:.10;pointer-events:none;transition:transform .45s var(--ease);}
.panel-orange .panel-bg-icon{left:-8%;}
.panel-white .panel-bg-icon{right:-8%;opacity:.12;}
.panel:hover .panel-bg-icon{transform:scale(1.06) rotate(-4deg);}

.panel-inner{position:relative;z-index:1;width:100%;padding:38px 32px 42px;}
@media(min-width:760px){.panel-inner{padding:0 44px 56px;}}
.panel-white .panel-inner{text-align:right;}

.panel-orange .panel-inner{opacity:0;transform:translateX(-22px);animation:slideInL .6s var(--ease) forwards;animation-delay:.15s;}
.panel-white .panel-inner{opacity:0;transform:translateX(22px);animation:slideInR .6s var(--ease) forwards;animation-delay:.3s;}
@keyframes slideInL{to{opacity:1;transform:translateX(0);}}
@keyframes slideInR{to{opacity:1;transform:translateX(0);}}

.panel-tag{
  display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:20px;
  padding:5px 11px;white-space:nowrap;margin-bottom:16px;
}
.panel-tag .dot{width:6px;height:6px;border-radius:50%;background:#fff;flex-shrink:0;box-shadow:0 0 0 3px rgba(255,255,255,.18);}
.panel-white .panel-tag{background:rgba(26,19,16,.05);border-color:rgba(26,19,16,.14);}
.panel-white .panel-tag .dot{background:var(--orange-2);box-shadow:0 0 0 3px rgba(255,90,31,.16);}

.panel-title{font-size:clamp(26px,4.6vw,40px);font-weight:800;letter-spacing:-.01em;line-height:1.15;}
.panel-desc{font-size:13px;margin-top:10px;line-height:1.7;opacity:.82;max-width:24em;}
.panel-white .panel-desc{margin-left:auto;opacity:.68;}

.panel-cta{display:inline-flex;align-items:center;gap:6px;margin-top:22px;font-size:13px;font-weight:700;color:currentColor;}
.panel-cta svg{width:15px;height:15px;transition:transform .22s var(--ease);}
.panel:hover .panel-cta svg{transform:translateX(4px);}
</style>
</head>
<body>

  <div class="intro" id="intro">
    <svg class="intro-mark" viewBox="0 0 200 200" fill="none" stroke="var(--orange-2)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 176 L112 76"/>
      <path d="M36 160 L100 90"/>
      <path d="M92,82 Q88,64 100,60 Q108,58 108,70"/>
      <path d="M106,70 Q104,52 116,48 Q124,46 123,59"/>
      <path d="M120,60 Q119,42 131,39 Q138,37 137,50"/>
      <path d="M92,82 Q102,94 120,92 Q134,90 140,76"/>
      <path d="M80,90 Q70,98 72,111 Q74,121 86,119 Q98,117 102,105"/>
      <path d="M140,76 Q152,90 148,107"/>
      <path d="M136,110 Q144,102 152,109 Q159,116 167,109 Q175,102 182,109 L188,137 Q190,149 179,153 L148,159 Q136,157 134,145 Z"/>
    </svg>
    <div class="intro-word">
      <span class="ch">食</span><span class="ch">べ</span><span class="ch">ロ</span><span class="ch">グ</span>
    </div>
  </div>

  <main class="split">
    <a class="panel panel-orange" href="https://wa-ra-so.github.io/sinntenn/">
      <svg class="panel-bg-icon" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.3-4.3"/>
      </svg>
      <div class="panel-inner">
        <span class="panel-tag"><span class="dot"></span>1日6回更新</span>
        <h2 class="panel-title">新店<br>リサーチ</h2>
        <p class="panel-desc">新規開店の飲食店をニュース・求人から自動収集し一覧表示</p>
        <span class="panel-cta">開く
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>

    <a class="panel panel-white" href="https://wa-ra-so.github.io/hppzaiko/">
      <svg class="panel-bg-icon" viewBox="0 0 24 24" fill="none" stroke="var(--orange-2)" stroke-width="1.4">
        <rect x="6" y="4" width="12" height="17" rx="2"/>
        <path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/>
        <path d="M9 11l2 2 4-4"/>
      </svg>
      <div class="panel-inner">
        <span class="panel-tag"><span class="dot"></span>1時間おき更新</span>
        <h2 class="panel-title">HPP在庫<br>不可リスト</h2>
        <p class="panel-desc">ネット予約不可・解約・新規掲載の店を検出し架電の優先度を可視化</p>
        <span class="panel-cta">開く
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </div>
    </a>
  </main>

<script>
(function(){
  var intro = document.getElementById('intro');
  if(sessionStorage.getItem('portalIntroPlayed')){
    intro.style.display = 'none';
    return;
  }
  setTimeout(function(){
    intro.classList.add('hide');
    sessionStorage.setItem('portalIntroPlayed', '1');
    setTimeout(function(){ intro.style.display = 'none'; }, 520);
  }, 1750);
})();
</script>
</body>
</html>
